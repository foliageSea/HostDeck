name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild Windows CLI and macOS assets for"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify existing release for manual rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then exit 0; fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

  build-web:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Install Dependencies
        run: |
          cd host-deck-ui
          npm install -g pnpm@10.34.5
          pnpm install --frozen-lockfile
      - name: Build Web
        run: |
          cd host-deck-ui
          pnpm build
      - name: Verify reusable desktop package
        working-directory: host-deck-ui
        run: |
          pnpm test:webos
          pnpm verify:webos-package
      - name: Verify pi-ai bridge
        working-directory: host-deck-ai
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run build:bin
          pnpm run test:bin
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: host-deck-ui/dist

  build-sidecars:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Resolve release version
        id: version
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test native SideCar on Debian 12
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sidecar-native
          platforms: linux/${{ matrix.arch }}
          build-args: HOSTDECK_VERSION=${{ steps.version.outputs.value }}
          outputs: type=local,dest=build/sidecar-native
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-linux-${{ matrix.arch }}
          path: build/sidecar-native/hostdeck-file-sidecar-linux-${{ matrix.arch }}
          if-no-files-found: error

  merge-sidecars:
    needs: build-sidecars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: sidecar-linux-*
          merge-multiple: true
          path: build/sidecar-release/sidecars
      - name: Generate and verify SideCar manifest
        run: |
          version="${RELEASE_TAG#v}"
          dir=build/sidecar-release/sidecars
          node scripts/sidecar_assets.mjs manifest "$dir" "$version"
          node scripts/sidecar_assets.mjs verify "$dir" "$version"
          chmod 0755 "$dir"/hostdeck-file-sidecar-linux-{amd64,arm64}
          cp LICENSE THIRD_PARTY_NOTICES.md build/sidecar-release/
          tar -czf "build/host-deck-sidecars-$RELEASE_TAG.tar.gz" -C build/sidecar-release sidecars LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-assets
          path: build/sidecar-release/sidecars
          if-no-files-found: error
      - name: Upload SideCar Release Asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: build/host-deck-sidecars-${{ github.ref_name }}.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-cli-windows:
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.11.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Resolve Dart Dependencies
        run: dart pub get --enforce-lockfile
      - name: Build HostDeck CLI
        run: dart build cli --target bin/hostdeck_cli.dart --output build/hostdeck-cli
      - name: Install pnpm
        run: npm install -g pnpm@10.34.5
      - name: Build pi-ai bridge
        run: node scripts/build_ai.mjs build/hostdeck-cli/bundle
      - name: Include License Notices
        shell: pwsh
        run: |
          Copy-Item LICENSE build\hostdeck-cli\bundle\LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md build\hostdeck-cli\bundle\THIRD_PARTY_NOTICES.md
      - name: Archive HostDeck CLI
        shell: pwsh
        run: Compress-Archive -Path build\hostdeck-cli\bundle\* -DestinationPath "host-deck-cli-windows-$env:RELEASE_TAG.zip"
      - name: Upload HostDeck CLI
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: host-deck-cli-windows-${{ env.RELEASE_TAG }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    if: github.event_name == 'push'
    needs: [build-web, merge-sidecars]
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-assets
          path: build/sidecar-assets
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve release version and verify SideCar assets
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/sidecar_assets.mjs verify build/sidecar-assets "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and load Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-contexts: sidecar-assets=./build/sidecar-assets
          platforms: linux/amd64
          load: true
          build-args: |
            HOSTDECK_VERSION=${{ steps.version.outputs.value }}
            HOSTDECK_REVISION=${{ github.sha }}
          tags: |
            host-deck:${{ steps.version.outputs.value }}
            host-deck:latest
      - name: Export Docker image archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker save "host-deck:$VERSION" host-deck:latest | gzip > "/tmp/host-deck-$GITHUB_REF_NAME.tar.gz"
      - name: Upload Docker Image Asset
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/host-deck-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image to GitHub Packages
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/host-deck"
          docker tag "host-deck:$VERSION" "$image:$VERSION"
          docker push "$image:$VERSION"
          # Prereleases must not replace the stable latest tag.
          if [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            docker tag "host-deck:$VERSION" "$image:latest"
            docker push "$image:latest"
          fi

  build-electron-windows:
    if: github.event_name == 'push'
    needs: [build-web, merge-sidecars]
    env:
      HOSTDECK_SIDECAR_ASSETS_DIR: build/sidecar-assets
      HOSTDECK_REQUIRE_SIDECARS: "1"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: host-deck-ui/dist
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-assets
          path: build/sidecar-assets
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.11.0"
      - name: Install Dependencies
        run: |
          npm install -g pnpm@10.34.5
          pnpm --dir host-deck-electron install --frozen-lockfile
      - name: Verify Web Artifact
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "host-deck-ui/dist/index.html")) {
            throw "Missing web artifact: host-deck-ui/dist/index.html"
          }
      - name: Build Electron Windows
        run: pnpm --dir host-deck-electron electron:pack:win:prepared
      - name: Verify packaged SideCar assets
        shell: pwsh
        run: node scripts/sidecar_assets.mjs verify host-deck-electron/release/win-unpacked/resources/server/sidecars ($env:GITHUB_REF_NAME.Substring(1))
      - name: Upload Electron Windows
        uses: softprops/action-gh-release@v2
        with:
          files: |
            host-deck-electron/release/*.exe
            host-deck-electron/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-electron-macos-arm64:
    needs: [build-web, merge-sidecars]
    env:
      HOSTDECK_SIDECAR_ASSETS_DIR: build/sidecar-assets
      HOSTDECK_REQUIRE_SIDECARS: "1"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: host-deck-ui/dist
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-assets
          path: build/sidecar-assets
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.11.0"
      - name: Install Dependencies
        run: |
          npm install -g pnpm@10.34.5
          pnpm --dir host-deck-electron install --frozen-lockfile
      - name: Verify Web Artifact
        run: |
          test -f host-deck-ui/dist/index.html
      - name: Verify Apple Silicon Runner
        run: test "$(uname -m)" = "arm64"
      - name: Verify macOS packaging hook
        run: node --test host-deck-electron/src/scripts/after-pack.test.cjs
      - name: Build Electron macOS ARM64
        run: pnpm --dir host-deck-electron electron:pack:mac:prepared
      - name: Verify packaged SideCar assets
        run: node scripts/sidecar_assets.mjs verify host-deck-electron/release/mac-arm64/HostDeck.app/Contents/Resources/server/sidecars "${RELEASE_TAG#v}"
      - name: Upload Electron macOS ARM64
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            host-deck-electron/release/*.dmg
            host-deck-electron/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
