  build-docker:
    needs: [build-web, merge-sidecars]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-assets
          path: build/sidecar-assets
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve release version and verify SideCar assets
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/sidecar_assets.mjs verify build/sidecar-assets "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image Tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-contexts: sidecar-assets=./build/sidecar-assets
          push: false
          build-args: |
            HOSTDECK_VERSION=${{ steps.version.outputs.value }}
            HOSTDECK_REVISION=${{ github.sha }}
          tags: |
            host-deck:${{ steps.version.outputs.value }}
            host-deck:latest
          outputs: type=docker,dest=/tmp/host-deck-${{ github.ref_name }}.tar
      - name: Compress Docker Image Tar
        run: gzip -f /tmp/host-deck-${{ github.ref_name }}.tar
      - name: Upload Docker Image Asset
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/host-deck-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

