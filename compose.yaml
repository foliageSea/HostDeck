services:
  host-deck:
    build:
      context: .
      args:
        HOSTDECK_VERSION: ${HOSTDECK_VERSION:-dev}
        HOSTDECK_REVISION: ${HOSTDECK_REVISION:-unknown}
    image: host-deck:local
    ports:
      - "${HOSTDECK_PORT:-8080}:8080"
    environment:
      HOSTDECK_ACCESS_TOTP_SECRET: ${HOSTDECK_ACCESS_TOTP_SECRET:-}
    volumes:
      - host-deck-data:/data
    restart: unless-stopped

volumes:
  host-deck-data:
