<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="OpenCode">
  <defs>
    <linearGradient id="bg" x1="64" y1="6" x2="64" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34363C"/>
      <stop offset="1" stop-color="#111215"/>
    </linearGradient>
    <linearGradient id="rim" x1="20" y1="8" x2="64" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="64" y1="6" x2="64" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="64" y1="30" x2="64" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9CCD3"/>
    </linearGradient>
    <linearGradient id="core" x1="64" y1="46" x2="64" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B7F89"/>
      <stop offset="1" stop-color="#4A4D55"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#gloss)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="29.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- OpenCode mark: frame -->
  <path fill="url(#frame)" fill-rule="evenodd" filter="url(#drop)"
        d="M36 30h56a6 6 0 0 1 6 6v56a6 6 0 0 1-6 6H36a6 6 0 0 1-6-6V36a6 6 0 0 1 6-6Zm10 16v36h36V46H46Z"/>

  <!-- inner core -->
  <rect x="46" y="46" width="36" height="36" fill="url(#core)"/>
  <rect x="46" y="46" width="36" height="18" fill="#FFFFFF" opacity="0.08"/>

  <!-- terminal cursor -->
  <rect x="53" y="70" width="14" height="5" rx="2.5" fill="#22D3EE" opacity="0.85" filter="url(#glow)"/>
  <rect x="53" y="70" width="14" height="5" rx="2.5" fill="url(#cursor)"/>
</svg>
