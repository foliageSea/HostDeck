<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="进程管理">
  <defs>
    <linearGradient id="bg" x1="64" y1="6" x2="64" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A3D45"/>
      <stop offset="1" stop-color="#16171B"/>
    </linearGradient>
    <linearGradient id="rim" x1="20" y1="8" x2="64" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="40" y1="34" x2="88" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AC8FA"/>
      <stop offset="0.55" stop-color="#2F7BF5"/>
      <stop offset="1" stop-color="#5B3FD9"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F2F3F5"/>
      <stop offset="1" stop-color="#A9ADB5"/>
    </linearGradient>
    <linearGradient id="shine" x1="64" y1="34" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE3FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="29.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- chip glow -->
  <rect x="38" y="38" width="52" height="52" rx="12" fill="#3B82F6" opacity="0.55" filter="url(#glow)"/>

  <!-- pins -->
  <g fill="url(#pin)">
    <rect x="46" y="25" width="6" height="14" rx="3"/>
    <rect x="61" y="25" width="6" height="14" rx="3"/>
    <rect x="76" y="25" width="6" height="14" rx="3"/>
    <rect x="46" y="89" width="6" height="14" rx="3"/>
    <rect x="61" y="89" width="6" height="14" rx="3"/>
    <rect x="76" y="89" width="6" height="14" rx="3"/>
    <rect x="25" y="46" width="14" height="6" rx="3"/>
    <rect x="25" y="61" width="14" height="6" rx="3"/>
    <rect x="25" y="76" width="14" height="6" rx="3"/>
    <rect x="89" y="46" width="14" height="6" rx="3"/>
    <rect x="89" y="61" width="14" height="6" rx="3"/>
    <rect x="89" y="76" width="14" height="6" rx="3"/>
  </g>

  <!-- chip body -->
  <rect x="35" y="35" width="58" height="58" rx="14" fill="url(#chip)" filter="url(#drop)"/>
  <rect x="35" y="35" width="58" height="29" rx="14" fill="url(#shine)"/>
  <rect x="35.75" y="35.75" width="56.5" height="56.5" rx="13.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- process load bars -->
  <rect x="47" y="64" width="8" height="18" rx="4" fill="url(#bar)" opacity="0.8"/>
  <rect x="60" y="48" width="8" height="34" rx="4" fill="url(#bar)"/>
  <rect x="73" y="57" width="8" height="25" rx="4" fill="url(#bar)" opacity="0.9"/>
</svg>
