<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="任务中心">
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="card" x1="64" y1="32" x2="64" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1E6"/>
    </linearGradient>
    <linearGradient id="done" x1="37" y1="44" x2="51" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9F1239" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>

  <!-- stacked queue cards -->
  <rect x="40" y="19" width="48" height="20" rx="9" fill="#FFFFFF" opacity="0.4"/>
  <rect x="32" y="25" width="64" height="20" rx="10" fill="#FFFFFF" opacity="0.65"/>

  <!-- front card -->
  <rect x="24" y="32" width="80" height="72" rx="16" fill="url(#card)" filter="url(#shadow)"/>

  <!-- row 1: done -->
  <circle cx="44" cy="51" r="8" fill="url(#done)"/>
  <path d="m40.2 51.2 2.8 2.8 5-5.6" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="59" y="47.5" width="34" height="7" rx="3.5" fill="#D1D5DB"/>

  <!-- row 2: running -->
  <circle cx="44" cy="68" r="6.5" fill="none" stroke="#FED7AA" stroke-width="3.4"/>
  <circle cx="44" cy="68" r="6.5" fill="none" stroke="#F97316" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="27 14" transform="rotate(-90 44 68)"/>
  <rect x="59" y="64.5" width="28" height="7" rx="3.5" fill="#FDBA74"/>

  <!-- row 3: pending -->
  <circle cx="44" cy="85" r="6.5" fill="none" stroke="#CBD5E1" stroke-width="3.4"/>
  <rect x="59" y="81.5" width="20" height="7" rx="3.5" fill="#E5E7EB"/>
</svg>
