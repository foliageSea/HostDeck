<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="AI Agent">
  <defs>
    <linearGradient id="bg" x1="22" y1="6" x2="106" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C6CFF"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2B2FB8"/>
    </linearGradient>
    <linearGradient id="rim" x1="20" y1="8" x2="64" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="64" y1="6" x2="64" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="head" x1="64" y1="36" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE3FF"/>
    </linearGradient>
    <linearGradient id="face" x1="64" y1="52" x2="64" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252A66"/>
      <stop offset="1" stop-color="#14173F"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F0B4D" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#gloss)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="29.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- antenna -->
  <path d="M64 40V30" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="26" r="6" fill="url(#spark)"/>

  <!-- ears -->
  <rect x="17" y="58" width="10" height="24" rx="5" fill="#C7D2FE"/>
  <rect x="101" y="58" width="10" height="24" rx="5" fill="#C7D2FE"/>

  <!-- head -->
  <rect x="24" y="38" width="80" height="66" rx="24" fill="url(#head)" filter="url(#drop)"/>

  <!-- face screen -->
  <rect x="33" y="48" width="62" height="44" rx="16" fill="url(#face)"/>
  <rect x="33.75" y="48.75" width="60.5" height="42.5" rx="15.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- eyes -->
  <g fill="#22D3EE" opacity="0.8" filter="url(#glow)">
    <rect x="47" y="60" width="9" height="15" rx="4.5"/>
    <rect x="72" y="60" width="9" height="15" rx="4.5"/>
  </g>
  <rect x="47" y="60" width="9" height="15" rx="4.5" fill="url(#eye)"/>
  <rect x="72" y="60" width="9" height="15" rx="4.5" fill="url(#eye)"/>

  <!-- sparkle -->
  <path d="M104 14c1 6 3 8 9 9-6 1-8 3-9 9-1-6-3-8-9-9 6-1 8-3 9-9Z" fill="#FFFFFF" opacity="0.95"/>
</svg>
